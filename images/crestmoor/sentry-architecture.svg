<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580" role="img"><title>Sentry conceptual architecture</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#17191C"/></marker></defs><rect width="100%" height="100%" fill="#FBF9F4"/><g font-family="Helvetica,Arial,sans-serif" fill="#17191C"><text x="40" y="45" font-size="28" font-weight="bold">SENTRY: PUBLIC ARCHITECTURE OVERVIEW</text><text x="40" y="78" font-size="18" fill="#55585C">Conceptual relationships, not an implementation specification</text><rect x="40" y="115" width="380" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="60" y="152" font-size="24" font-weight="bold">NODE</text><text x="60" y="182" font-size="18" fill="#55585C">Edge compute and sensor I/O</text><rect x="40" y="240" width="380" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="60" y="277" font-size="24" font-weight="bold">OS</text><text x="60" y="307" font-size="18" fill="#55585C">Perception, mapping, mission services</text><rect x="480" y="115" width="380" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="500" y="152" font-size="24" font-weight="bold">MESH</text><text x="500" y="182" font-size="18" fill="#55585C">Shared state, node loss and resync</text><rect x="480" y="240" width="380" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="500" y="277" font-size="24" font-weight="bold">LINK</text><text x="500" y="307" font-size="18" fill="#55585C">Adapters to hosts, radios, operators</text><path d="M230,210 L230,240" fill="none" stroke="#17191C" stroke-width="2" marker-end="url(#arrow)"/><path d="M420,162 L480,162" fill="none" stroke="#17191C" stroke-width="2" marker-end="url(#arrow)"/><path d="M670,210 L670,240" fill="none" stroke="#17191C" stroke-width="2" marker-end="url(#arrow)"/><path d="M420,288 L480,288" fill="none" stroke="#17191C" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="400" width="250" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="60" y="437" font-size="24" font-weight="bold">HOST A</text><text x="60" y="467" font-size="18" fill="#55585C">Compatible vehicle</text><rect x="325" y="400" width="250" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="345" y="437" font-size="24" font-weight="bold">HOST B</text><text x="345" y="467" font-size="18" fill="#55585C">Compatible vehicle</text><rect x="610" y="400" width="250" height="95" rx="8" fill="#F6F3EC" stroke="#7A1F2B"/><text x="630" y="437" font-size="24" font-weight="bold">OPERATOR</text><text x="630" y="467" font-size="18" fill="#55585C">Human supervision</text><path d="M670,335 L670,365 L165,365 L165,400 M450,365 L450,400 M670,365 L735,365 L735,400" fill="none" stroke="#17191C" stroke-width="2"/><text x="40" y="545" font-size="18">Lines represent illustrative interfaces; local processing remains at each node.</text></g></svg>